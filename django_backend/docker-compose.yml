version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cmrg_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmrg_survey}
      POSTGRES_USER: ${POSTGRES_USER:-cmrg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmrg_admin -d cmrg_survey"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmrg_django_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 cmrg_survey.wsgi:application"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/static
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - POSTGRES_DB=${POSTGRES_DB:-cmrg_survey}
      - POSTGRES_USER=${POSTGRES_USER:-cmrg_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - SIMPLE_JWT_SIGNING_KEY=${SIMPLE_JWT_SIGNING_KEY}
      - CMRG_MOBILE_SYNC_KEY=${CMRG_MOBILE_SYNC_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
